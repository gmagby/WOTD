name: Daily Word Update

on:
  schedule:
    # 3:00 AM CST is 8:00 AM or 9:00 AM UTC depending on DST.
    # CST is UTC-6, CDT is UTC-5. 
    # To be safe, let's run at 09:00 UTC (3:00 AM CST or 4:00 AM CDT).
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-word:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Daily Update
        env:
          DICTIONARY_KEY: ${{ secrets.DICTIONARY_KEY }}
          THESAURUS_KEY: ${{ secrets.THESAURUS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PATH: git
        run: python daily_update.py
